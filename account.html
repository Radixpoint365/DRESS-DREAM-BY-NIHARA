<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090707"><title>My Account | Dress Dreams by Nihara"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.account-shell{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:45px 18px;background:#f7f3ed}.account-card{width:min(520px,100%);background:#fffdf9;border:1px solid #e3d9cd;padding:clamp(22px,5vw,42px);box-shadow:0 18px 55px #21170d12}.account-card h1{font:42px 'Cormorant Garamond',serif;margin:0 0 6px}.account-sub{color:#786d61;font-size:13px;line-height:1.7}.account-tabs{display:flex;gap:8px;margin:24px 0}.account-tabs button,.account-submit{padding:12px 16px;border:1px solid #b99b6b;background:#171311;color:#e8d7b8;cursor:pointer;letter-spacing:1px;font-size:11px}.account-tabs button[aria-selected=true]{background:#b99b6b;color:#171311}.account-form{display:grid;gap:10px}.account-form label{font-size:10px;letter-spacing:1px;font-weight:600;margin-top:8px}.account-form input{width:100%;padding:13px;border:1px solid #d8cbbb;background:white;font:14px 'DM Sans',sans-serif}.account-submit{margin-top:12px}.account-message{font-size:13px;line-height:1.6;color:#6b5739;min-height:22px}.account-hidden{display:none!important}.account-back{display:inline-block;margin-bottom:20px;color:#5e4a32;text-decoration:none;font-size:12px}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/dress-dream-logo.jpeg" alt="Dress Dreams by Nihara"></a><a href="index.html" class="text-link">BACK TO STORE ↗</a></header><main class="account-shell"><section class="account-card"><a class="account-back" href="index.html">← CONTINUE SHOPPING</a><p class="eyebrow">DRESS DREAMS BY NIHARA</p><h1>Your account</h1><p class="account-sub">Sign in or create an account to stay connected with your orders.</p><div id="signedIn" class="account-hidden"><p id="accountEmail"></p><button id="signOut" class="account-submit" type="button">SIGN OUT</button></div><div id="authPanel"><div class="account-tabs"><button type="button" id="emailTab" aria-selected="true">EMAIL</button><button type="button" id="phoneTab" aria-selected="false">MOBILE OTP</button></div><form id="emailForm" class="account-form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">PASSWORD</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="account-submit" type="submit" data-mode="signin">SIGN IN</button><button class="account-submit" type="submit" data-mode="signup">CREATE ACCOUNT</button></div></form><form id="phoneForm" class="account-form account-hidden"><label for="phone">MOBILE NUMBER WITH COUNTRY CODE</label><input id="phone" type="tel" autocomplete="tel" placeholder="+919876543210"><button class="account-submit" type="submit">SEND OTP</button><label for="otp">VERIFICATION CODE</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the OTP"><button class="account-submit" id="verifyOtp" type="button">VERIFY OTP</button></form></div><p id="accountMessage" class="account-message" role="status"></p></section></main><script src="supabase-config.js"></script><script type="module" src="account.js"></script></body></html>
