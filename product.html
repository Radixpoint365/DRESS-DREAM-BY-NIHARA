
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Dress Dreams by Nihara</title>
    <meta name="description" content="Explore beautiful fashion at Dress Dreams by Nihara.">

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --champagne: #d8bd83;
            --product-dark: #111;
        }

        body {
            background: #0c0c0c;
            color: #f8f5ee;
            margin: 0;
        }

        .product-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 6%;
            background: #111;
            border-bottom: 1px solid #30291e;
        }

        .product-page-header a {
            color: var(--champagne);
            text-decoration: none;
            font-weight: 600;
        }

        .product-page-header .brand {
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* Main layout: image first, details below */
        #productDetailsPage .product-page-container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        #productDetailsPage .product-details-layout {
            display: flex !important;
            flex-direction: column !important;
            align-items: center;
            gap: 30px;
        }

        #productDetailsPage .product-gallery {
            width: 100%;
            max-width: 460px;
            min-width: 0;
            margin: 0 auto;
        }

        #productDetailsPage .main-product-image {
            width: 100%;
            height: 480px;
            max-height: 65vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #181818;
            border: 1px solid #352e22;
            border-radius: 12px;
        }

        #productDetailsPage .main-product-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        #productDetailsPage .product-thumbnails {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        #productDetailsPage .product-thumbnail {
            width: 68px;
            height: 82px;
            padding: 0;
            overflow: hidden;
            background: #181818;
            border: 1px solid #51452f;
            border-radius: 7px;
            cursor: pointer;
        }

        #productDetailsPage .product-thumbnail.active {
            border: 2px solid var(--champagne);
        }

        #productDetailsPage .product-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Product information */
        #productDetailsPage .product-page-info {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 5px 0 20px;
        }

        #productDetailsPage .product-page-category {
            color: var(--champagne);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 10px;
        }

        #productDetailsPage .product-page-info h1 {
            color: #fff;
            font-size: clamp(25px, 5vw, 34px);
            line-height: 1.3;
            margin: 0 0 12px;
        }

        #productDetailsPage .product-page-price {
            color: var(--champagne);
            font-size: 27px;
            font-weight: 700;
            margin: 12px 0;
        }

        #productDetailsPage .product-page-description {
            color: #c2bdb3;
            font-size: 15px;
            line-height: 1.8;
            margin: 18px 0 25px;
        }

        #productDetailsPage .product-option-title {
            color: var(--champagne);
            font-size: 13px;
            font-weight: 600;
            margin: 22px 0 12px;
            letter-spacing: 1px;
        }

        #productDetailsPage .product-option-title strong {
            color: #fff;
            margin-left: 5px;
            letter-spacing: 0;
        }

        /* Colour and size selection buttons */
        #productDetailsPage .product-page-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #productDetailsPage .product-page-options button {
            min-width: 48px;
            min-height: 42px;
            padding: 10px 16px;
            background: #191919;
            color: #f8f5ee;
            border: 1px solid #514936;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s ease;
        }

        #productDetailsPage .product-page-options button:hover:not(:disabled) {
            border-color: var(--champagne);
            color: var(--champagne);
        }

        #productDetailsPage .product-page-options button.selected {
            background: var(--champagne);
            color: #111;
            border-color: var(--champagne);
        }

        #productDetailsPage .product-page-options button:disabled {
            opacity: .35;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        #productDetailsPage .product-page-stock {
            color: #c4bdaF;
            font-size: 13px;
            margin: 20px 0;
        }

        /* Quantity */
        #productDetailsPage .product-page-quantity {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        #productDetailsPage .product-page-quantity strong {
            margin-right: 8px;
        }

        #productDetailsPage .product-page-quantity button {
            width: 38px;
            height: 38px;
            background: #191919;
            color: #fff;
            border: 1px solid #6c5b3b;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        #productDetailsPage .product-page-quantity button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        #productDetailsPage .product-page-quantity span {
            min-width: 20px;
            text-align: center;
        }

        /* Add to bag */
        #productDetailsPage .product-page-add {
            width: 100%;
            padding: 16px;
            background: linear-gradient(100deg, #b99a5b, #e5d0a0);
            color: #111;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #productDetailsPage .product-page-add:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        #productDetailsPage .product-page-note {
            color: #999;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }

        #productDetailsPage .back-to-shop {
            display: inline-block;
            color: var(--champagne);
            text-decoration: none;
            margin-bottom: 22px;
        }

        /* Related products */
        #productDetailsPage .related-products {
            margin-top: 55px;
        }

        #productDetailsPage .related-products h2 {
            color: var(--champagne);
            font-size: 21px;
            margin-bottom: 20px;
        }

        #productDetailsPage .related-product-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        #productDetailsPage .related-product-card {
            min-width: 0;
            color: #fff;
            text-decoration: none;
            background: #171717;
            border: 1px solid #30291e;
            border-radius: 9px;
            padding: 10px;
            overflow: hidden;
        }

        #productDetailsPage .related-product-card img {
            display: block;
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 6px;
        }

        #productDetailsPage .related-product-card h3 {
            font-size: 14px;
            margin: 12px 0 6px;
        }

        #productDetailsPage .related-product-card p {
            color: var(--champagne);
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .product-page-header {
                padding: 15px 4%;
            }

            .product-page-header .brand {
                font-size: 13px;
            }

            .product-page-header a:last-child {
                font-size: 12px;
            }

            #productDetailsPage .product-page-container {
                margin: 20px auto;
                padding: 0 15px;
            }

            #productDetailsPage .main-product-image {
                height: 390px;
                max-height: 60vh;
            }

            #productDetailsPage .related-product-grid {
                gap: 12px;
            }

            #productDetailsPage .related-product-card img {
                height: 170px;
            }
        }
    </style>
</head>

<body>

    <header class="product-page-header">
        <a class="brand" href="index.html">DRESS DREAMS BY NIHARA</a>
        <a href="index.html">← Back to Shop</a>
    </header>

    <main>
        <div id="productDetailsPage">
            <p style="text-align:center;padding:60px 15px;">
                Loading product details...
            </p>
        </div>
    </main>

    <script src="supabase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
