
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | Dress Dreams by Nihara</title>

    <meta name="description" content="Discover elegant fashion at Dress Dreams by Nihara.">

    <link rel="icon" href="assets/dress-dream-logo.jpeg">

    <style>
        :root {
            --black: #111111;
            --gold: #c5a66c;
            --gold-dark: #a88950;
            --cream: #faf8f3;
            --white: #ffffff;
            --text: #292929;
            --muted: #777777;
            --border: #e8e2d7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--cream);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font-family: inherit;
        }

        /* HEADER */

        .product-header {
            height: 82px;
            width: 100%;
            padding: 0 6%;
            background: var(--black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gold);
        }

        .brand-name {
            color: var(--gold);
            font-family: Georgia, serif;
            font-size: 21px;
            letter-spacing: 1.5px;
            text-decoration: none;
        }

        .brand-name small {
            display: block;
            text-align: center;
            font-size: 10px;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        /* SHOPPING BAG ICON */

        .product-cart-button {
            position: relative;
            width: 65px;
            height: 65px;
            padding: 5px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .bag-shape {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 49px;
            margin-top: 12px;
            background: #111;
            border: 1px solid var(--gold);
            border-radius: 4px 4px 9px 9px;
        }

        .bag-handle {
            position: absolute;
            width: 25px;
            height: 18px;
            top: -16px;
            left: 14px;
            border: 3px solid var(--gold);
            border-bottom: none;
            border-radius: 14px 14px 0 0;
        }

        .bag-shape img {
            width: 42px;
            height: 34px;
            object-fit: contain;
            background: #fff;
            border-radius: 2px;
        }

        .product-cart-button > #cartCount {
            position: absolute;
            top: 0;
            right: 0;
            min-width: 19px;
            height: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gold);
            color: #000;
            border: 1px solid #fff;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
        }

        /* PRODUCT PAGE AREA */

        #productDetailsPage {
            min-height: 75vh;
            padding: 35px 6%;
        }

        .product-page-container {
            max-width: 1200px;
            margin: auto;
        }

        .back-to-shop {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .back-to-shop:hover {
            color: var(--gold-dark);
        }

        .product-details-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px;
            align-items: start;
        }

        /* PRODUCT GALLERY */

        .product-gallery {
            width: 100%;
        }

        .main-product-image {
            width: 100%;
            height: 520px;
            background: #f0ede6;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mainProductImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-thumbnails {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .product-thumbnail {
            width: 75px;
            height: 85px;
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
        }

        .product-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-thumbnail:hover {
            border-color: var(--gold);
        }

        /* PRODUCT INFORMATION */

        .product-page-info {
            padding-top: 12px;
        }

        .product-page-category {
            color: var(--gold-dark);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .product-page-info h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 18px;
        }

        .product-page-price {
            font-size: 25px;
            font-weight: bold;
            color: var(--black);
            margin-bottom: 22px;
        }

        .product-page-description {
            color: #666;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .product-option-title {
            font-size: 14px;
            font-weight: bold;
            margin: 20px 0 12px;
        }

        .product-page-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-page-options button {
            min-width: 42px;
            min-height: 38px;
            padding: 8px 13px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .product-page-options button:hover,
        .product-page-options button.active,
        .product-page-options button.selected {
            background: var(--black);
            color: var(--gold);
            border-color: var(--gold);
        }

        .product-page-stock {
            margin-top: 18px;
            color: #38834b;
            font-size: 13px;
        }

        /* QUANTITY */

        .product-page-quantity {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 22px 0;
        }

        .product-page-quantity button {
            width: 35px;
            height: 35px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 18px;
        }

        /* ADD TO BAG */

        .product-page-add {
            width: 100%;
            padding: 16px;
            background: var(--black);
            color: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-page-add:hover {
            background: var(--gold);
            color: var(--black);
        }

        .product-page-note {
            color: var(--muted);
            font-size: 12px;
            margin-top: 18px;
            line-height: 1.7;
        }

        /* RELATED PRODUCTS */

        .related-products {
            margin-top: 75px;
        }

        .related-products h2 {
            font-family: Georgia, serif;
            font-size: 27px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .related-product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .related-product-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
        }

        .related-product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        /* CART DRAWER */

        #drawerBackdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }

        #drawerBackdrop.open {
            opacity: 1;
            visibility: visible;
        }

        #cartDrawer {
            position: fixed;
            top: 0;
            right: -430px;
            width: 400px;
            max-width: 90%;
            height: 100%;
            background: #fff;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
            box-shadow: -5px 0 25px rgba(0,0,0,0.1);
        }

        #cartDrawer.open {
            right: 0;
        }

        .cart-header {
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .cart-header h2 {
            font-family: Georgia, serif;
            font-weight: normal;
        }

        #cartClose {
            background: none;
            border: none;
            font-size: 27px;
            cursor: pointer;
        }

        #cartItems {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-row {
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .qty-controls button,
        .remove-item {
            cursor: pointer;
        }

        .cart-footer {
            padding: 22px;
            border-top: 1px solid var(--border);
        }

        .cart-subtotal {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 18px;
        }

        #checkoutButton {
            width: 100%;
            padding: 15px;
            background: var(--black);
            color: var(--gold);
            border: 1px solid var(--gold);
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* TOAST */

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--black);
            color: var(--gold);
            padding: 13px 22px;
            border-radius: 5px;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            text-align: center;
            max-width: 90%;
        }

        #toast.show {
            opacity: 1;
            visibility: visible;
        }

        /* FOOTER */

        .product-footer {
            margin-top: 60px;
            padding: 30px 15px;
            text-align: center;
            background: var(--black);
            color: var(--gold);
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 768px) {
            .product-header {
                height: 70px;
                padding: 0 18px;
            }

            .brand-name {
                font-size: 16px;
            }

            .brand-name small {
                font-size: 8px;
            }

            #productDetailsPage {
                padding: 22px 16px;
            }

            .product-details-layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .main-product-image {
                height: 390px;
            }

            .product-page-info h1 {
                font-size: 26px;
            }

            .product-page-price {
                font-size: 22px;
            }

            .related-product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .related-product-card img {
                height: 170px;
            }

            .related-products {
                margin-top: 45px;
            }
        }

        @media (max-width: 380px) {
            .main-product-image {
                height: 310px;
            }

            .product-page-info h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="product-header">

        <a href="index.html" class="brand-name">
            DRESS DREAMS
            <small>BY NIHARA</small>
        </a>

        <button
            type="button"
            id="cartToggle"
            class="product-cart-button"
            aria-label="Open shopping bag">

            <span class="bag-shape">
                <span class="bag-handle"></span>

                <img
                    src="assets/dress-dream-logo.jpeg"
                    alt="Dress Dreams by Nihara logo">
            </span>

            <span id="cartCount">0</span>
        </button>

    </header>

    <!-- PRODUCT DETAILS ARE LOADED BY script.js -->
    <main id="productDetailsPage">
        <p style="text-align:center;padding:60px 10px;">
            Loading product...
        </p>
    </main>

    <!-- CART BACKDROP -->
    <div id="drawerBackdrop"></div>

    <!-- SHOPPING CART DRAWER -->
    <aside id="cartDrawer" aria-hidden="true">

        <div class="cart-header">
            <h2>Your Shopping Bag</h2>

            <button
                type="button"
                id="cartClose"
                aria-label="Close shopping bag">
                &times;
            </button>
        </div>

        <div id="cartItems">
            <!-- Cart items are loaded by script.js -->
        </div>

        <div class="cart-footer">

            <div class="cart-subtotal">
                <span>Subtotal</span>
                <span id="cartSubtotal">₹0</span>
            </div>

            <button type="button" id="checkoutButton">
                PROCEED TO CHECKOUT
            </button>

        </div>

    </aside>

    <!-- TOAST MESSAGE -->
    <div id="toast" role="status"></div>

    <!-- FOOTER -->
    <footer class="product-footer">
        © 2026 DRESS DREAMS BY NIHARA. ALL RIGHTS RESERVED.
    </footer>

    <!-- SUPABASE CONNECTION -->
    <script src="supabase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
