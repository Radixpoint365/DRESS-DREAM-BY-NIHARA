
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Dress Dreams by Nihara</title>
    <meta name="description" content="Explore beautiful fashion at Dress Dreams by Nihara.">

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --champagne: #d8bd83;
            --dark: #111111;
            --muted: #bdb8ad;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: #0c0c0c;
            color: #f8f5ee;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* HEADER */

        .product-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 18px 6%;
            border-bottom: 1px solid #29251e;
            background: #111;
        }

        .product-page-header a {
            color: var(--champagne);
            text-decoration: none;
            font-weight: 600;
        }

        .product-page-header .brand {
            font-size: 19px;
            letter-spacing: 1px;
        }

        /* MAIN CONTAINER */

        .product-page-container {
            width: 100%;
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: var(--champagne);
            text-decoration: none;
        }

        /* PRODUCT CONTENT */

        #productDetailsPage {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 25px;
            min-width: 0;
        }

        /* IMAGE ABOVE DETAILS */

        .product-details-layout {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            width: 100%;
            gap: 25px !important;
            min-width: 0;
        }

        .product-gallery {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-width: 0;
        }

        .main-product-image {
            display: block;
            width: 100% !important;
            max-width: 480px;
            height: 480px !important;
            max-height: 65vh;
            object-fit: contain !important;
            margin: 0 auto;
            background: #181818;
            border: 1px solid #302b23;
            border-radius: 12px;
        }

        .product-thumbnails {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .product-thumbnail {
            width: 65px !important;
            height: 75px !important;
            object-fit: cover;
            border: 1px solid #51452f;
            border-radius: 7px;
            cursor: pointer;
        }

        /* PRODUCT INFORMATION */

        .product-information {
            width: 100%;
            max-width: 650px;
            padding: 10px 0;
            margin: 0 auto;
            overflow-wrap: anywhere;
            min-width: 0;
        }

        .product-information h1 {
            font-size: clamp(24px, 4vw, 34px);
            line-height: 1.3;
            margin: 0 0 14px;
            color: #fff;
        }

        .product-description {
            color: var(--muted);
            line-height: 1.8;
            margin: 18px 0;
            overflow-wrap: anywhere;
        }

        .product-price {
            color: var(--champagne);
            font-size: 27px;
            font-weight: bold;
            margin: 15px 0;
        }

        /* COLOUR AND SIZE OPTIONS */

        .product-option {
            margin: 22px 0;
            width: 100%;
        }

        .product-option h3 {
            font-size: 14px;
            color: var(--champagne);
            margin-bottom: 12px;
        }

        .option-buttons {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .option-button {
            padding: 10px 16px;
            background: #191919;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
        }

        .option-button.active,
        .option-button:focus {
            border-color: var(--champagne);
            color: var(--champagne);
        }

        /* STOCK */

        .product-stock {
            color: var(--muted);
            margin: 15px 0;
            font-size: 14px;
        }

        /* QUANTITY */

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 22px 0;
        }

        .quantity-control button {
            width: 36px;
            height: 36px;
            border: 1px solid #6c5b3b;
            background: #191919;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .quantity-control span {
            min-width: 20px;
            text-align: center;
        }

        /* ADD TO BAG */

        .add-to-bag-button {
            display: block;
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 7px;
            background: linear-gradient(100deg, #b99a5b, #e5d0a0);
            color: #111;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-to-bag-button:hover {
            opacity: .9;
        }

        /* RELATED PRODUCTS */

        .related-products {
            margin-top: 55px;
        }

        .related-products h2 {
            color: var(--champagne);
            margin-bottom: 25px;
        }

        #relatedProducts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* LOADING MESSAGE */

        .page-message {
            color: var(--champagne);
            padding: 40px 10px;
            text-align: center;
        }

        /* PRODUCT IMAGE SAFETY */

        #productDetailsPage img {
            max-width: 100%;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 600px) {

            .product-page-header {
                padding: 15px 5%;
            }

            .product-page-header .brand {
                font-size: 14px;
            }

            .product-page-container {
                margin-top: 20px;
                padding: 0 15px;
            }

            .main-product-image {
                height: 360px !important;
                max-height: 60vh;
            }

            .product-information h1 {
                font-size: 25px;
            }

            .product-price {
                font-size: 24px;
            }

            .product-thumbnails {
                gap: 8px;
            }

            .product-thumbnail {
                width: 55px !important;
                height: 65px !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="product-page-header">
        <a class="brand" href="index.html">
            DRESS DREAMS BY NIHARA
        </a>

        <a href="index.html">
            ← Back to Shop
        </a>
    </header>

    <!-- MAIN PRODUCT PAGE -->

    <main class="product-page-container">

        <a class="back-link" href="index.html">
            ← Continue Shopping
        </a>

        <!-- JavaScript loads product information here -->

        <div id="productDetailsPage">
            <div class="page-message">
                Loading product details...
            </div>
        </div>

        <!-- RELATED PRODUCTS -->

        <section class="related-products">
            <h2>You May Also Like</h2>

            <div id="relatedProducts"></div>
        </section>

    </main>

    <!-- SUPABASE AND WEBSITE JAVASCRIPT -->

    <script src="supabase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
