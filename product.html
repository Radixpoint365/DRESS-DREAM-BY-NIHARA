
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Dress Dreams by Nihara</title>
    <meta name="description" content="Explore beautiful fashion at Dress Dreams by Nihara.">

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --champagne: #c5a66c;
            --champagne-light: #e6d4ad;
            --dark-text: #29251f;
            --muted-text: #746d62;
            --cream: #faf8f3;
            --white: #fffdf9;
            --border: #e5dccd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--cream) !important;
            color: var(--dark-text) !important;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* HEADER */

        .product-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 6%;
            background: var(--white) !important;
            border-bottom: 1px solid var(--border);
        }

        .product-page-header a {
            color: #927343 !important;
            text-decoration: none;
            font-weight: 600;
        }

        .product-page-header .brand {
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* MAIN CONTAINER */

        #productDetailsPage .product-page-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 30px;
        }

        #productDetailsPage .back-to-shop {
            display: inline-block;
            color: #927343;
            text-decoration: none;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* DESKTOP PRODUCT LAYOUT */

        #productDetailsPage .product-details-layout {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr) !important;
            align-items: start;
            gap: 55px;
        }

        /* PRODUCT IMAGE */

        #productDetailsPage .product-gallery {
            width: 100%;
            max-width: 520px;
            min-width: 0;
            margin: 0 auto;
        }

        #productDetailsPage .main-product-image {
            width: 100%;
            height: 560px;
            max-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f0ece4 !important;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        #productDetailsPage .main-product-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        /* IMAGE THUMBNAILS */

        #productDetailsPage .product-thumbnails {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 14px;
        }

        #productDetailsPage .product-thumbnail {
            width: 68px;
            height: 82px;
            padding: 0;
            overflow: hidden;
            background: #f0ece4;
            border: 1px solid #d9cdb8;
            border-radius: 7px;
            cursor: pointer;
        }

        #productDetailsPage .product-thumbnail.active {
            border: 2px solid var(--champagne);
        }

        #productDetailsPage .product-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PRODUCT INFORMATION */

        #productDetailsPage .product-page-info {
            width: 100%;
            max-width: 520px;
            padding: 10px 0;
        }

        #productDetailsPage .product-page-category {
            color: #927343;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 12px;
        }

        #productDetailsPage .product-page-info h1 {
            color: var(--dark-text);
            font-size: clamp(25px, 3vw, 36px);
            line-height: 1.3;
            margin: 0 0 12px;
        }

        #productDetailsPage .product-page-price {
            color: #927343;
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0;
        }

        #productDetailsPage .product-page-description {
            color: var(--muted-text);
            font-size: 15px;
            line-height: 1.8;
            margin: 20px 0 25px;
        }

        /* COLOUR AND SIZE LABELS */

        #productDetailsPage .product-option-title {
            color: #927343;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 23px 0 12px;
        }

        #productDetailsPage .product-option-title strong {
            color: var(--dark-text);
            margin-left: 5px;
            letter-spacing: 0;
        }

        /* COLOUR AND SIZE BUTTONS */

        #productDetailsPage .product-page-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #productDetailsPage .product-page-options button {
            min-width: 48px;
            min-height: 42px;
            padding: 10px 16px;
            background: var(--white);
            color: #39342d;
            border: 1px solid #d9cdb8;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #productDetailsPage .product-page-options button:hover:not(:disabled) {
            background: #f5efe3;
            border-color: var(--champagne);
            color: #765b2e;
        }

        #productDetailsPage .product-page-options button.selected {
            background: var(--champagne);
            color: #241d12;
            border-color: #b99a5b;
        }

        #productDetailsPage .product-page-options button:disabled {
            background: #f0ede7;
            color: #aaa49a;
            opacity: 0.6;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* STOCK */

        #productDetailsPage .product-page-stock {
            color: var(--muted-text);
            font-size: 13px;
            margin: 20px 0;
        }

        /* QUANTITY */

        #productDetailsPage .product-page-quantity {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 22px 0;
            color: var(--dark-text);
        }

        #productDetailsPage .product-page-quantity strong {
            margin-right: 8px;
        }

        #productDetailsPage .product-page-quantity button {
            width: 38px;
            height: 38px;
            background: var(--white);
            color: var(--dark-text);
            border: 1px solid #d9cdb8;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        #productDetailsPage .product-page-quantity button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #productDetailsPage .product-page-quantity span {
            min-width: 20px;
            text-align: center;
        }

        /* ADD TO BAG */

        #productDetailsPage .product-page-add {
            width: 100%;
            padding: 16px;
            background: linear-gradient(
                100deg,
                #c4a66b,
                #e6d4ad
            );
            color: #241d12;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        #productDetailsPage .product-page-add:hover:not(:disabled) {
            opacity: 0.85;
        }

        #productDetailsPage .product-page-add:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #productDetailsPage .product-page-note {
            color: #81796d;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }

        /* RELATED PRODUCTS */

        #productDetailsPage .related-products {
            margin-top: 65px;
        }

        #productDetailsPage .related-products h2 {
            color: #927343;
            font-size: 23px;
            margin-bottom: 22px;
        }

        #productDetailsPage .related-product-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        #productDetailsPage .related-product-card {
            display: block;
            min-width: 0;
            overflow: hidden;
            padding: 10px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--dark-text);
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        #productDetailsPage .related-product-card:hover {
            transform: translateY(-4px);
        }

        #productDetailsPage .related-product-card img {
            display: block;
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 6px;
        }

        #productDetailsPage .related-product-card h3 {
            font-size: 14px;
            margin: 12px 0 6px;
        }

        #productDetailsPage .related-product-card p {
            color: #927343;
            font-weight: 700;
        }

        /* NOT FOUND */

        #productDetailsPage .product-not-found {
            text-align: center;
            padding: 60px 20px;
            color: var(--dark-text);
        }

        #productDetailsPage .product-not-found a {
            color: #927343;
        }

        /* TABLET */

        @media (max-width: 900px) {
            #productDetailsPage .product-details-layout {
                gap: 30px;
            }

            #productDetailsPage .main-product-image {
                height: 460px;
            }

            #productDetailsPage .related-product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .product-page-header {
                padding: 15px 4%;
            }

            .product-page-header .brand {
                font-size: 13px;
            }

            .product-page-header a:last-child {
                font-size: 12px;
            }

            #productDetailsPage .product-page-container {
                margin: 20px auto;
                padding: 0 15px;
            }

            #productDetailsPage .product-details-layout {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                gap: 25px;
            }

            #productDetailsPage .product-gallery {
                width: 100%;
                max-width: 460px;
            }

            #productDetailsPage .main-product-image {
                height: 390px;
                max-height: 60vh;
            }

            #productDetailsPage .product-page-info {
                width: 100%;
                max-width: 650px;
            }

            #productDetailsPage .related-product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            #productDetailsPage .related-product-card img {
                height: 170px;
            }
        }

        /* SMALL MOBILE */

        @media (max-width: 380px) {
            #productDetailsPage .main-product-image {
                height: 320px;
            }

            #productDetailsPage .product-page-options {
                gap: 7px;
            }

            #productDetailsPage .product-page-options button {
                min-width: 42px;
                padding: 9px 12px;
            }
        }
    </style>
</head>

<body>

    <header class="product-page-header">
        <a class="brand" href="index.html">
            DRESS DREAMS BY NIHARA
        </a>

        <a href="index.html">
            ← Back to Shop
        </a>
    </header>

    <main>
        <div id="productDetailsPage">
            <p style="text-align:center;padding:60px 15px;">
                Loading product details...
            </p>
        </div>
    </main>

    <script src="supabase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
