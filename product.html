
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090707">

    <title>Product | Dress Dreams by Nihara</title>
    <meta name="description" content="Discover elegant fashion at Dress Dreams by Nihara.">

    <link rel="icon" href="assets/dress-dream-logo.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f7f3ed;
            color: #171311;
            font-family: "DM Sans", sans-serif;
            font-weight: 300;
        }

        button {
            font-family: inherit;
        }

        /* HEADER */

        .product-header {
            height: 92px;
            padding: 12px 5.5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090707;
            border-bottom: 1px solid #28211b;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand {
            width: 300px;
            display: block;
        }

        .brand img {
            width: 100%;
            display: block;
            max-height: 72px;
            object-fit: contain;
        }

        /* PRODUCT PAGE HEADER CART BUTTON */

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .icon-button {
            border: 0;
            background: none;
            color: #e8dfd2;
            font-size: 25px;
            cursor: pointer;
            position: relative;
        }

        .bag-button span {
            position: absolute;
            top: -5px;
            right: -9px;
            background: #b99b6b;
            color: #090707;
            border-radius: 50%;
            font-size: 9px;
            width: 16px;
            height: 16px;
            display: grid;
            place-items: center;
        }

        /* PRODUCT PAGE */

        #productDetailsPage {
            min-height: 75vh;
            padding: 35px 6%;
        }

        .product-page-container {
            max-width: 1200px;
            margin: auto;
        }

        .back-to-shop {
            display: inline-block;
            color: #171311;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .back-to-shop:hover {
            color: #a88950;
        }

        .product-details-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px;
            align-items: start;
        }

        /* PRODUCT GALLERY */

        .product-gallery {
            width: 100%;
        }

        .main-product-image {
            width: 100%;
            height: 520px;
            background: #eee8df;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mainProductImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-thumbnails {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .product-thumbnail {
            width: 75px;
            height: 85px;
            border: 1px solid #c9bba9;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
        }

        .product-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-thumbnail:hover {
            border-color: #b99b6b;
        }

        /* PRODUCT INFORMATION */

        .product-page-info {
            padding-top: 12px;
        }

        .product-page-category {
            color: #a78b61;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .product-page-info h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 42px;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 18px;
        }

        .product-page-price {
            font-size: 25px;
            font-weight: 600;
            color: #171311;
            margin-bottom: 22px;
        }

        .product-page-description {
            color: #746b61;
            line-height: 1.9;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .product-option-title {
            font-size: 13px;
            font-weight: 600;
            margin: 20px 0 12px;
        }

        .product-page-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-page-options button {
            min-width: 42px;
            min-height: 38px;
            padding: 8px 13px;
            background: transparent;
            border: 1px solid #c9bba9;
            cursor: pointer;
            transition: 0.2s;
        }

        .product-page-options button:hover,
        .product-page-options button.active,
        .product-page-options button.selected {
            background: #171311;
            color: #d7c4a2;
            border-color: #b99b6b;
        }

        .product-page-stock {
            margin-top: 18px;
            color: #38834b;
            font-size: 13px;
        }

        /* QUANTITY */

        .product-page-quantity {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 22px 0;
        }

        .product-page-quantity button {
            width: 35px;
            height: 35px;
            border: 1px solid #c9bba9;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        /* ADD TO BAG */

        .product-page-add {
            width: 100%;
            padding: 16px;
            background: #171311;
            color: #d7c4a2;
            border: 1px solid #b99b6b;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-page-add:hover {
            background: #b99b6b;
            color: #100d0a;
        }

        .product-page-note {
            color: #786d61;
            font-size: 11px;
            margin-top: 18px;
            line-height: 1.7;
        }

        /* RELATED PRODUCTS */

        .related-products {
            margin-top: 75px;
        }

        .related-products h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 25px;
        }

        .related-product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .related-product-card {
            background: #fff;
            border: 1px solid #e3d9cd;
            overflow: hidden;
        }

        .related-product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        /* =================================
           SAME SHOPPING BAG AS HOMEPAGE
        ================================= */

        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: #0009;
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            transition: .25s;
        }

        .drawer-backdrop.open {
            opacity: 1;
            visibility: visible;
        }

        .cart-drawer {
            position: fixed;
            z-index: 41;
            right: 0;
            top: 0;
            height: 100dvh;
            width: min(440px, 100%);
            background: #f7f3ed;
            transform: translateX(102%);
            transition: transform .3s;
            display: flex;
            flex-direction: column;
            padding: 28px;
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd2c4;
            padding-bottom: 18px;
        }

        .drawer-head .eyebrow {
            font-size: 9px;
            letter-spacing: 3px;
            color: #a78b61;
            font-weight: 600;
            margin: 0 0 8px;
        }

        .drawer-head h2 {
            font: 32px "Cormorant Garamond", serif;
            margin: 0;
            font-weight: 400;
        }

        .drawer-head .icon-button {
            color: #171311;
            font-size: 28px;
        }

        .cart-items {
            overflow: auto;
            flex: 1;
            padding: 15px 0;
        }

        .empty-cart {
            color: #817568;
            font-size: 12px;
            text-align: center;
            margin-top: 45px;
        }

        .cart-row {
            display: grid;
            grid-template-columns: 70px 1fr auto;
            gap: 13px;
            padding: 12px 0;
            border-bottom: 1px solid #e3d9cd;
        }

        .cart-row img {
            width: 70px;
            height: 88px;
            object-fit: cover;
        }

        .cart-row h4 {
            font: 19px "Cormorant Garamond", serif;
            margin: 4px 0;
        }

        .cart-row p {
            font-size: 11px;
            margin: 0;
            color: #786d61;
        }

        .qty-controls {
            display: flex;
            gap: 9px;
            align-items: center;
            margin-top: 9px;
        }

        .qty-controls button,
        .remove-item {
            border: 0;
            background: none;
            cursor: pointer;
            color: #5e4a32;
        }

        .cart-bottom {
            border-top: 1px solid #ddd2c4;
            padding-top: 18px;
        }

        .subtotal {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .subtotal strong {
            font-size: 16px;
        }

        .cart-bottom > p,
        .cart-bottom > small {
            font-size: 10px;
            color: #786d61;
            line-height: 1.6;
        }

        .gold-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
            background: #b99b6b;
            color: #100d0a;
            border: 1px solid #b99b6b;
            padding: 16px 22px;
            text-decoration: none;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.8px;
            cursor: pointer;
            transition: .25s;
        }

        .gold-button:hover {
            background: #d0b88f;
            border-color: #d0b88f;
        }

        .checkout-button {
            width: 100%;
            margin: 12px 0;
        }

        /* TOAST */

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: #171311;
            color: #fff;
            padding: 12px 20px;
            font-size: 11px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 60;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* FOOTER */

        .product-footer {
            margin-top: 60px;
            padding: 30px 15px;
            text-align: center;
            background: #090707;
            color: #d7c4a2;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /* RESPONSIVE */

        @media(max-width: 900px) {
            .brand {
                width: 240px;
            }

            .related-product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 768px) {
            .product-header {
                height: 76px;
                padding: 8px 5%;
            }

            .brand {
                width: 205px;
            }

            #productDetailsPage {
                padding: 22px 16px;
            }

            .product-details-layout {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .main-product-image {
                height: 390px;
            }

            .product-page-info h1 {
                font-size: 32px;
            }

            .product-page-price {
                font-size: 22px;
            }

            .related-product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .related-product-card img {
                height: 170px;
            }

            .related-products {
                margin-top: 45px;
            }
        }

        @media(max-width: 380px) {
            .brand {
                width: 175px;
            }

            .main-product-image {
                height: 310px;
            }

            .product-page-info h1 {
                font-size: 27px;
            }

            .cart-drawer {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="product-header">

        <a class="brand" href="index.html" aria-label="Dress Dreams home">
            <img src="assets/dress-dream-logo.jpeg" alt="Dress Dreams by Nihara logo">
        </a>

        <div class="header-actions">
            <button
                class="icon-button bag-button"
                id="cartToggle"
                type="button"
                aria-label="Shopping bag">
                ♧ <span id="cartCount">0</span>
            </button>
        </div>

    </header>

    <!-- PRODUCT DETAILS -->
    <main id="productDetailsPage">
        <p style="text-align:center;padding:60px 10px;">
            Loading product...
        </p>
    </main>

    <!-- SAME BACKDROP AS HOMEPAGE -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- SAME CART DRAWER AS HOMEPAGE -->
    <aside
        class="cart-drawer"
        id="cartDrawer"
        aria-label="Shopping bag"
        aria-hidden="true">

        <div class="drawer-head">
            <div>
                <p class="eyebrow">YOUR SELECTION</p>
                <h2>Your shopping bag</h2>
            </div>

            <button
                class="icon-button"
                id="cartClose"
                type="button"
                aria-label="Close cart">
                ×
            </button>
        </div>

        <div class="cart-items" id="cartItems">
            <p class="empty-cart">
                Your bag is waiting for something beautiful.
            </p>
        </div>

        <div class="cart-bottom">

            <div class="subtotal">
                <span>Subtotal</span>
                <strong id="cartSubtotal">₹0</strong>
            </div>

            <p>Shipping and taxes calculated at checkout.</p>

            <button
                class="gold-button checkout-button"
                id="checkoutButton"
                type="button">
                CONTINUE TO CHECKOUT →
            </button>

            <small>
                UPI & cards will be available at secure checkout.
                Cash on Delivery is not available.
            </small>

        </div>
    </aside>

    <!-- TOAST -->
    <div class="toast" id="toast" role="status"></div>

    <!-- FOOTER -->
    <footer class="product-footer">
        © 2026 DRESS DREAMS BY NIHARA. ALL RIGHTS RESERVED.
    </footer>

    <!-- SUPABASE -->
    <script src="supabase-config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
