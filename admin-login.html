<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In | Dress Dreams by Nihara</title><link rel="stylesheet" href="style.css"><style>.auth-wrap{max-width:460px;margin:9vh auto;padding:24px}.auth-card{background:#fffdf9;border:1px solid #e4d9ca;padding:34px}.auth-card h1{font:42px Georgia;color:#211b15}.auth-card label{display:block;margin:17px 0 7px;font:11px Arial;letter-spacing:1px;color:#766958}.auth-card input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ded4c7}.auth-card button{width:100%;margin-top:20px;padding:14px;background:#b99b6b;border:0;cursor:pointer}.auth-card p{font:13px Arial;line-height:1.6;color:#766958}#authMessage{color:#8a342c;min-height:20px}</style></head><body class="admin-body"><header class="admin-top"><a href="index.html">DRESS DREAMS <small>BY NIHARA</small></a><a href="index.html">VIEW STORE ↗</a></header><main class="auth-wrap"><section class="auth-card"><p>PRIVATE STORE ACCESS</p><h1>Admin sign in</h1><p>Use the administrator email and password created in Supabase. Only authorised admin accounts can enter.</p><form id="adminLoginForm"><label>ADMIN EMAIL</label><input id="adminEmail" type="email" autocomplete="username" required><label>PASSWORD</label><input id="adminPassword" type="password" autocomplete="current-password" required><button id="loginButton">SIGN IN →</button></form><p id="authMessage" role="status"></p><a href="index.html">← Back to store</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin-auth.js"></script></body></html>
